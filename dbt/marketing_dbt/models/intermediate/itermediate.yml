version: 2

models:
  - name: int_campaign_performance
    description: >
      Aggregated campaign performance metrics combining marketing staging models
      with sales data from publishing-mesh-sales domain (source: top_products, docelowo orders_curated).
    columns:
      - name: campaign_id
        description: Campaign identifier at campaign grain.
        data_tests:
          - not_null
        #  - unique

      - name: campaign_name
        description: Campaign name.
        data_tests:
          - not_null

      - name: channel
        description: Marketing channel used by the campaign.

      - name: objective
        description: Marketing objective of the campaign.

      - name: target_segment
        description: Target audience segment.

      - name: start_date
        description: Campaign planned start date.

      - name: end_date
        description: Campaign planned end date.

      - name: budget_amount
        description: Declared campaign budget.

      - name: status
        description: Campaign status.

      - name: owner_team
        description: Owning marketing team.

      - name: total_impressions
        description: Sum of impressions across all metric rows.

      - name: total_clicks
        description: Sum of clicks across all metric rows.

      - name: total_cost_amount
        description: Sum of marketing spend across all metric rows.

      - name: total_sessions
        description: Sum of sessions across all metric rows.

      - name: total_add_to_cart
        description: Sum of add to cart events across all metric rows.

      - name: total_orders
        description: Sum of orders for books promoted in this campaign. Source - publishing-mesh-sales domain.

      - name: total_items_sold
        description: Sum of items sold for books promoted in this campaign. Source - publishing-mesh-sales domain.

      - name: ctr
        description: Click-through rate - total_clicks / total_impressions.

      - name: cpc
        description: Cost per click - total_cost_amount / total_clicks.

      - name: cvr
        description: Conversion rate - total_items_sold / total_clicks. Proxy for conversions using sales domain data.

      - name: cost_per_sale
        description: Marketing cost per sold item - total_cost_amount / total_items_sold.