version: 2

models:
  - name: mrt_campaign_daily_performance
    description: Daily campaign performance metrics. Internal marketing model.
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null

  - name: mrt_campaign_performance
    description: >
      Aggregated campaign performance combining media metrics with sales data
      from publishing-mesh-sales domain. Internal marketing summary model.
    columns:
      - name: campaign_id
        data_tests:
          - not_null
          - unique
      - name: performance_segment
        data_tests:
          - not_null
          - accepted_values:
              values: ['no_reach', 'no_clicks', 'traffic_only', 'converting']

  - name: mrt_campaign_sales_attribution
    description: >
      Published data product for the Marketing domain.
      Stable interface exposing campaign-to-book attribution with sales metrics.
      Grain: one row per campaign_id + book_id combination.
      Source of sales data: publishing-mesh-sales domain (top_products, docelowo orders_curated).
    columns:
      - name: campaign_id
        data_tests:
          - not_null
      - name: book_id
        data_tests:
          - not_null
      - name: total_items_sold
        data_tests:
          - not_null