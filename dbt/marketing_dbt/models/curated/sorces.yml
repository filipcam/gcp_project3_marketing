version: 2

sources:
  - name: marketing_raw
    database: data-mesh-marketing
    schema: marketing_raw
    tables:
      - name: ext_marketing_campaigns
        columns:
          - name: campaign_id
            data_tests:
              - not_null

      - name: ext_marketing_campaign_products
        columns:
          - name: campaign_id
            data_tests:
              - not_null
          - name: book_id
            data_tests:
              - not_null

      - name: ext_marketing_campaign_daily_metrics
        columns:
          - name: campaign_id
            data_tests:
              - not_null
          - name: event_date
            data_tests:
              - not_null

  - name: sales
    database: publishing-mesh-sales
    schema: sales_products
    description: "Dane sprzedażowe domeny Publishing."
    tables:
      - name: book_daily_sales
        description: "Dzienna sprzedaż książek per book_id. Zastępuje top_products (MVP)."
        columns:
          - name: book_id
            data_tests:
              - not_null
          - name: sales_date
            data_tests:
              - not_null
          - name: gross_sales_amount
            data_tests:
              - not_null
